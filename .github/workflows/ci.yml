name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Pinned just: cached by version and SHA-256; on a miss, downloaded with bounded retries and the pin
      # enforced by the vendored tools/fetch/fetch-asset.sh (hosted runners use the origin, no mirror).
      - name: Restore pinned just
        id: just-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/just
          key: just-1.59.0-x86_64-unknown-linux-musl-409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e
      - name: Install pinned just
        if: steps.just-cache.outputs.cache-hit != 'true'
        env:
          JUST_VERSION: 1.59.0
          JUST_SHA256: 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/just" "$RUNNER_TEMP/just"
          bash tools/fetch/fetch-asset.sh "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz" "$JUST_SHA256" "$RUNNER_TEMP/just/just.tar.gz"
          tar -xzf "$RUNNER_TEMP/just/just.tar.gz" -C "$HOME/.local/just" just
      - name: Put just on PATH
        run: |
          echo "$HOME/.local/just" >> "$GITHUB_PATH"
          "$HOME/.local/just/just" --version
      - name: Install Claude Code marketplace validator
        run: npm install --global @anthropic-ai/claude-code@2.1.309
      - run: just ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
