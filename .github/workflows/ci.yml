name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: extractions/setup-just@v3
      - name: Install Claude Code marketplace validator
        run: npm install --global @anthropic-ai/claude-code@2.1.309
      - run: just ci
