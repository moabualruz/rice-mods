name: Security reporting

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '11 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          category: /language:javascript-typescript
      - name: Record reporting status
        if: always()
        run: printf 'CodeQL starts reporting-only. Findings and failed scans are not a clean baseline.\n' >> "$GITHUB_STEP_SUMMARY"

  secrets:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install pinned gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan fetched branch and tag history
        run: gitleaks git --log-opts='--all --full-history' --redact=100 --no-banner
      - name: Record reporting status
        if: always()
        run: printf 'Gitleaks starts reporting-only. This scan covers fetched GitHub refs, not unpublished local preservation refs.\n' >> "$GITHUB_STEP_SUMMARY"
