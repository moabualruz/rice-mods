name: Private source receipt recovery
run-name: 'Private source receipt recovery: ${{ inputs.source_repository }}'

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Original operation's exact private source
        required: true
        type: choice
        options:
          - moabualruz/rice-session-accounts
          - moabualruz/rice-multi-models
      source_commit:
        description: Original immutable source commit
        required: true
        type: string
      expected_head:
        description: Exact delivered main approved for this recovery
        required: true
        type: string
      original_binding_sha256:
        description: Original binding bytes
        required: true
        type: string
      original_head:
        description: Original qualification head
        required: true
        type: string
      original_workflow_sha256:
        description: Original qualification workflow bytes
        required: true
        type: string
      original_run_id:
        description: Original terminal qualification run
        required: true
        type: string
      original_run_attempt:
        description: Original qualification attempt
        required: true
        type: string

permissions: {}

jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      ORIGINAL_BINDING_SHA256: ${{ inputs.original_binding_sha256 }}
      ORIGINAL_HEAD: ${{ inputs.original_head }}
      ORIGINAL_WORKFLOW_SHA256: ${{ inputs.original_workflow_sha256 }}
      ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
      ORIGINAL_RUN_ATTEMPT: ${{ inputs.original_run_attempt }}
    steps:
      - name: Require the exact recovery context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = moabualruz/rice-mods
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$ORIGINAL_HEAD" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$ORIGINAL_BINDING_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$ORIGINAL_WORKFLOW_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$ORIGINAL_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$ORIGINAL_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          test "$GITHUB_JOB" = receipt
          case "$SOURCE_REPOSITORY" in
            moabualruz/rice-session-accounts|moabualruz/rice-multi-models) ;;
            *) exit 1 ;;
          esac
      - name: Emit the current secret fingerprint receipt
        shell: bash
        env:
          CURRENT_SECRET: ${{ secrets.MODS_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          export -n receipt_token
          receipt_token="${CURRENT_SECRET:?current secret is absent}"
          unset CURRENT_SECRET GH_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_ENTERPRISE_TOKEN RICE_RELEASE_DOWNLOAD_TOKEN RICE_RELEASE_DOWNLOAD_TOKEN_EXPIRES_AT
          fingerprint="$(printf '%s' "$receipt_token" | /usr/bin/sha256sum)"
          unset receipt_token
          fingerprint="${fingerprint%% *}"
          /usr/bin/jq -cn --arg repository "$GITHUB_REPOSITORY" --arg head "$GITHUB_SHA" \
            --arg source "$SOURCE_REPOSITORY" --arg commit "$SOURCE_COMMIT" \
            --arg binding "$ORIGINAL_BINDING_SHA256" --arg originalHead "$ORIGINAL_HEAD" \
            --arg originalWorkflow "$ORIGINAL_WORKFLOW_SHA256" --arg fingerprint "$fingerprint" \
            --argjson originalRun "$ORIGINAL_RUN_ID" --argjson originalAttempt "$ORIGINAL_RUN_ATTEMPT" \
            --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '{version:1,kind:"current-secret-value",repository:$repository,head:$head,workflow:".github/workflows/private-source-receipt.yml",sourceRepository:$source,sourceCommit:$commit,originalBindingSHA256:$binding,originalHead:$originalHead,originalWorkflowSHA256:$originalWorkflow,originalRunID:$originalRun,originalRunAttempt:$originalAttempt,runID:$run,runAttempt:$attempt,job:"receipt",tokenSHA256:$fingerprint}' \
            | while IFS= read -r receipt; do printf 'mods-source-recovery-receipt:%s\n' "$receipt"; done
